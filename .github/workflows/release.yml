name: Build and release desktop app

on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: cpu-avx
            backend: cpu
          - artifact: amd-vulkan
            backend: vulkan
          - artifact: nvidia-cuda
            backend: cuda

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: x64

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pyinstaller customtkinter cmake ninja

      - name: Install Vulkan SDK
        if: matrix.backend == 'vulkan'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "vulkan_sdk.exe"
          Invoke-WebRequest `
            -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe" `
            -OutFile $installer

          & $installer --accept-licenses --default-answer --confirm-command install
          if ($LASTEXITCODE -ne 0) {
            throw "A instalação do Vulkan SDK falhou."
          }

          $sdk = Get-ChildItem "C:\VulkanSDK" -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1

          if (-not $sdk) {
            throw "Vulkan SDK não foi encontrado em C:\VulkanSDK."
          }

          $sdkPath = $sdk.FullName.Replace('\', '/')
          $includePath = "$sdkPath/Include"
          $libraryPath = "$sdkPath/Lib/vulkan-1.lib"

          if (-not (Test-Path "$includePath/vulkan/vulkan.h")) {
            throw "Header do Vulkan não encontrado em $includePath."
          }
          if (-not (Test-Path $libraryPath)) {
            throw "Biblioteca Vulkan não encontrada em $libraryPath."
          }

          "VULKAN_SDK=$($sdk.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$($sdk.FullName)\Bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append


      - name: Set up CUDA toolkit
        if: matrix.backend == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.24
        with:
            cuda: "12.6.3"
            method: network
            sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev"]'
      - name: Install llama.cpp for CPU AVX
        if: matrix.backend == 'cpu'
        run: |
          python -m pip install llama-cpp-python

      - name: Build llama.cpp with Vulkan
        if: matrix.backend == 'vulkan'
        shell: pwsh
        run: |
          $sdk = Get-ChildItem "C:\VulkanSDK" -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $sdk) {
            throw "Vulkan SDK não foi encontrado."
          }

          $sdkPath = $sdk.FullName.Replace('\', '/')
          $includePath = "$sdkPath/Include"
          $libraryPath = "$sdkPath/Lib/vulkan-1.lib"

          $env:CMAKE_ARGS = "-DGGML_VULKAN=ON -DGGML_NATIVE=OFF -DGGML_AVX=OFF -DGGML_AVX2=OFF -DGGML_FMA=OFF -DGGML_F16C=OFF -DVulkan_INCLUDE_DIR:PATH=$includePath -DVulkan_LIBRARY:FILEPATH=$libraryPath"
          $env:FORCE_CMAKE = "1"
          $env:NPY_DISABLE_CPU_FEATURES = "AVX,AVX2,FMA3,AVX512F"

          python -m pip install --force-reinstall --no-cache-dir --no-binary=llama-cpp-python --no-deps llama-cpp-python
          if ($LASTEXITCODE -ne 0) {
            throw "A compilação do llama-cpp-python com Vulkan falhou."
          }
          $env:NPY_DISABLE_CPU_FEATURES = "AVX,AVX2,FMA3,AVX512F"
          python -m pip install numpy --no-binary=numpy --force-reinstall `
            --config-settings="setup-args=-Dcpu-baseline=none" `
            --config-settings="setup-args=-Dcpu-dispatch=none"
          if ($LASTEXITCODE -ne 0) {
            throw "A compilação do NumPy sem AVX falhou."
          }

      - name: Build llama.cpp with CUDA
        if: matrix.backend == 'cuda'
        shell: pwsh
        run: |
          $cudaRoot = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.6"
          $env:CUDA_PATH = $cudaRoot
          $env:CUDA_PATH_V12_6 = $cudaRoot
          $env:PATH += ";$cudaRoot\bin;$cudaRoot\libnvvp"
          $env:CUDACXX = "$cudaRoot\bin\nvcc.exe"

          # Ativa toolchain do Visual Studio
          & "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64

          $env:CMAKE_ARGS = "-DGGML_CUDA=ON -DGGML_NATIVE=OFF -DGGML_AVX=OFF -DGGML_AVX2=OFF -DGGML_FMA=OFF -DGGML_F16C=OFF"
          $env:FORCE_CMAKE = "1"

          python -m pip install typing_extensions
          python -m pip install --force-reinstall --no-cache-dir --no-binary=llama-cpp-python llama-cpp-python
          if ($LASTEXITCODE -ne 0) {
            throw "A compilação do llama-cpp-python com CUDA falhou."
          }

      - name: Package windowed one-file app
        shell: pwsh
        env:
          APP_NAME: RoItemInfoTranslator-${{ matrix.artifact }}
        run: |
          python -m pip install nuitka
          python -m nuitka --standalone --onefile --plugin-enable=tk-inter --include-package=customtkinter ro-iteminfo-llm-translator.py
          if ($LASTEXITCODE -ne 0) {
            throw "O empacotamento com PyInstaller falhou."
          }

          Compress-Archive `
            -Path "dist/$env:APP_NAME.exe" `
            -DestinationPath "$env:APP_NAME.zip" `
            -CompressionLevel Optimal

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: RoItemInfoTranslator-${{ matrix.artifact }}.zip
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create pre-release and upload builds
        uses: softprops/action-gh-release@v2
        with:
          tag_name: main-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: release-assets/*.zip
          fail_on_unmatched_files: true
