name: Build and release desktop app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: cpu-avx
            backend: cpu
          - artifact: amd-vulkan
            backend: vulkan
          - artifact: nvidia-cuda
            backend: cuda

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: x64

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pyinstaller customtkinter cmake ninja

      - name: Install Vulkan SDK
        if: matrix.backend == 'vulkan'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "vulkan_sdk.exe"
          Invoke-WebRequest `
            -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe" `
            -OutFile $installer
          & $installer --accept-licenses --default-answer --confirm-command install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $sdk = Get-ChildItem "C:\VulkanSDK" -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1

          if (-not $sdk) {
            throw "Vulkan SDK installation directory was not found."
          }

          "VULKAN_SDK=$($sdk.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$($sdk.FullName)\Bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set up CUDA toolkit
        if: matrix.backend == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: "12.6.3"
          method: network
          sub-packages: '["nvcc", "cudart"]'

      - name: Install llama.cpp for CPU AVX
        if: matrix.backend == 'cpu'
        run: python -m pip install llama-cpp-python

      - name: Build llama.cpp with Vulkan
        if: matrix.backend == 'vulkan'
        shell: pwsh
        run: |
          $env:CMAKE_ARGS = "-DGGML_VULKAN=ON -DGGML_NATIVE=OFF -DGGML_AVX=OFF -DGGML_AVX2=OFF -DGGML_FMA=OFF -DGGML_F16C=OFF -DVulkan_INCLUDE_DIR=$env:VULKAN_SDK\Include -DVulkan_LIBRARY=$env:VULKAN_SDK\Lib\vulkan-1.lib"
          $env:FORCE_CMAKE = "1"
          python -m pip install --no-cache-dir --no-binary=llama-cpp-python --no-deps llama-cpp-python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install numpy

      - name: Build llama.cpp with CUDA
        if: matrix.backend == 'cuda'
        shell: pwsh
        run: |
          $env:CMAKE_ARGS = "-DGGML_CUDA=ON -DGGML_NATIVE=OFF -DGGML_AVX=OFF -DGGML_AVX2=OFF -DGGML_FMA=OFF -DGGML_F16C=OFF"
          $env:FORCE_CMAKE = "1"
          python -m pip install --no-cache-dir --no-binary=llama-cpp-python --no-deps llama-cpp-python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install numpy

      - name: Package windowed GUI app
        shell: pwsh
        env:
          APP_NAME: RoItemInfoTranslator-${{ matrix.artifact }}
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name "$env:APP_NAME" `
            --collect-all customtkinter `
            --collect-all llama_cpp `
            ro-iteminfo-llm-translator.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Compress-Archive `
            -Path "dist/$env:APP_NAME" `
            -DestinationPath "$env:APP_NAME.zip" `
            -CompressionLevel Optimal

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: RoItemInfoTranslator-${{ matrix.artifact }}.zip
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release and upload packages
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*.zip
          fail_on_unmatched_files: true
